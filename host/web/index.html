<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fedora Pad">
<meta name="theme-color" content="#007aff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fedora Pad</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1d1d1f;--sub:#8e8e93;--sep:#d1d1d6;--fill:#e5e5ea;--key:#fff;--mod:#d1d3d9;
 --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--pink:#ff2d55;--teal:#30b0c7;
 --indigo:#5856d6;--yellow:#ffcc00;--gray:#8e8e93}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989f;--sep:#38383a;
 --fill:#2c2c2e;--key:#4a4a4e;--mod:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
button,.k,.tile,.sc,.row{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
 font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
 -webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px)
 calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px);max-width:900px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
.bar{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:10px}
.bar h1{flex:1;font-size:20px;margin:0;text-align:center}
.back{color:var(--blue);font-size:17px;padding:8px 4px;min-width:70px;text-align:left}
.right{min-width:70px;text-align:right}
.big{font-size:34px;font-weight:700;margin:6px 2px 4px}
.sub{color:var(--sub);font-size:14px}
.status{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:15px;margin:0 2px 16px}
.dot{width:10px;height:10px;border-radius:5px;background:var(--gray)}
.dot.on{background:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
/* a couplet: the halves side by side, or one under the other on a phone */
.bayt{display:flex;gap:18px;margin-top:12px}.bayt>div{flex:1}.bayt>div:last-child{text-align:left}
@media(max-width:600px){.bayt{flex-direction:column;gap:2px}.bayt>div:first-child{padding-left:12%}.bayt>div:last-child{padding-right:12%}}
.tile{background:var(--card);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;
 min-height:108px;transition:transform .08s}
.tile:active{transform:scale(.96)}
.chip{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:24px;color:#fff}
.tile b{font-size:16px}
/* phones: an iOS-style icon grid */
@media(max-width:430px){.tiles{grid-template-columns:repeat(4,1fr);gap:16px 6px}
 .tile{background:none;padding:0;min-height:0;align-items:center;gap:6px;text-align:center}
 .tile .chip{width:60px;height:60px;border-radius:14px;font-size:30px;box-shadow:0 1px 3px #0002}
 .tile b{font-size:11.5px;font-weight:500;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep);min-height:52px;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{font-size:13px;color:var(--sub);text-transform:uppercase;margin:18px 6px 6px;letter-spacing:.03em}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:13px 16px;font-weight:600;text-align:center}
.btn2{background:var(--fill);border-radius:12px;padding:13px 16px;font-weight:600;text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>*{flex:1}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.sc{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}
.sc span{font-size:24px}.sc:active{background:var(--fill)}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;
 box-shadow:0 2px 4px #0003;transition:left .2s}
.toggle.on{background:var(--green)}.toggle.on::after{left:22px}
input[type=range]{width:100%;accent-color:var(--blue);height:32px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 3px #0002}
/* keyboard */
.kb{display:flex;flex-direction:column;gap:6px}
.kr{display:flex;gap:5px}
.k{flex:1;min-width:0;height:clamp(38px,8.5vh,58px);border-radius:8px;background:var(--key);box-shadow:0 1px 0 #0004;
 font-size:clamp(13px,2.4vw,20px);display:grid;place-items:center;padding:0;white-space:nowrap;overflow:hidden}
.k.m{background:var(--mod);font-size:clamp(11px,1.8vw,15px)}
.k.on{background:var(--blue);color:#fff}.k:active{filter:brightness(.8)}
.phonekb{width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid var(--sep);background:var(--card)}
/* trackpad */
.pad{background:var(--fill);border-radius:18px;touch-action:none;height:calc(100vh - 230px);min-height:260px;
 display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;padding:20px}
.clicks{display:flex;gap:10px;margin-top:10px}.clicks button{flex:1;height:64px;border-radius:14px;background:var(--card)}
pre{background:#1c1c1e;color:#e5e5ea;border-radius:12px;padding:12px;font:13px ui-monospace,Menlo,monospace;
 white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;-webkit-user-select:text;user-select:text}
textarea{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--sep);background:var(--card);padding:12px;resize:vertical}
.search{width:100%;padding:11px 14px;border-radius:10px;border:0;background:var(--fill);margin-bottom:12px}
.note{border-radius:14px;padding:14px;color:#1d1d1f;min-height:100px;white-space:pre-wrap;text-align:left;word-break:break-word}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.code{font-size:34px;letter-spacing:10px;text-align:center;width:100%;padding:12px;border-radius:12px;border:1px solid var(--sep);background:var(--card)}
.center{text-align:center}
.stat{display:flex;justify-content:space-between;padding:4px 0}
.meter{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;background:var(--blue)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#000c;
 color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const app = document.getElementById("app");
const store = {
  get: (k, d) => { try { const v = localStorage.getItem("fp_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem("fp_" + k, JSON.stringify(v)); } catch (e) {} },
};
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
function toast(text) {
  const t = el("div", {class: "toast"}, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}
function haptic() { if (navigator.vibrate) navigator.vibrate(8); }
const COLORS = {blue: "var(--blue)", green: "var(--green)", red: "var(--red)", orange: "var(--orange)",
  purple: "var(--purple)", pink: "var(--pink)", teal: "var(--teal)", indigo: "var(--indigo)", yellow: "var(--yellow)", gray: "var(--gray)"};
const chip = (sym, color) => el("div", {class: "chip", style: "background:" + (COLORS[color] || color)}, sym);

// ---------------------------------------------------------------- connection
const link = {ws: null, connected: false, host: "", os: "linux", app: "", handlers: {}, retry: null};
function send(obj) { if (link.ws && link.ws.readyState === 1) link.ws.send(JSON.stringify(obj)); }
function on(type, fn) { if (fn) link.handlers[type] = fn; else delete link.handlers[type]; }
const combo = keys => send({t: "combo", keys});
const command = name => send({t: "cmd", name});
function action(a) {  // "cmd:files", "url:https://…", "app:id", "text:…", or a key combo
  const i = a.indexOf(":"), kind = i < 0 ? "combo" : a.slice(0, i), value = i < 0 ? a : a.slice(i + 1);
  if (kind === "cmd") command(value);
  else if (kind === "url") send({t: "url", u: value});
  else if (kind === "app" || kind === "launch") send({t: "launch", id: value});
  else if (kind === "text") send({t: "text", s: value});
  else combo(value);
}
function connect() {
  clearTimeout(link.retry);
  const token = store.get("token", "");
  if (!token) return showPairing();
  if (link.ws && link.ws.readyState <= 1) return;
  const ws = new WebSocket("wss://" + location.host + "/ws?token=" + encodeURIComponent(token));
  link.ws = ws;
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "hello") { link.connected = true; link.host = m.host || "PC"; link.os = m.os || "linux"; refreshStatus();
      send({t: "iam", name: myName(), kind: myKind()}); send({t: "shared?"}); }
    if (hubMessage(m)) return;
    if (m.t === "app") { link.app = m.name || ""; refreshStatus(); }
    if (m.t === "pushfile") return receiveFile(m);   // AirDrop from the PC
    if (m.t === "pushtext") return receiveText(m.s || "", m.from);
    const h = link.handlers[m.t]; if (h) h(m);
  };
  ws.onclose = ev => {
    link.connected = false; refreshStatus();
    if (ev.code === 4401) { store.set("token", ""); return showPairing(); }
    link.retry = setTimeout(connect, 2000);
  };
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) connect(); });
let statusEls = [];
function statusLine() {
  const s = el("div", {class: "status"}, el("span", {class: "dot"}), el("span"));
  statusEls.push(s); paintStatus(s); return s;
}
function paintStatus(s) {
  s.firstChild.className = "dot" + (link.connected ? " on" : "");
  s.lastChild.textContent = link.connected ? link.host + (link.app ? " · " + link.app : "") : "Connecting…";
}
function refreshStatus() { statusEls = statusEls.filter(s => s.isConnected); statusEls.forEach(paintStatus); }

// ---------------------------------------------------------------- AirDrop from the PC
const incoming = {};
function receiveFile(m) {
  const f = incoming[m.id] || (incoming[m.id] = {parts: [], got: 0, toast: null});
  const bin = atob(m.data || ""), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  f.parts.push(bytes); f.got += bytes.length;
  if (!m.last) {
    if (m.size > 2e6 && (!f.shownAt || Date.now() - f.shownAt > 1500)) {
      f.shownAt = Date.now(); toast("📥 " + m.name + "  " + Math.round(f.got * 100 / m.size) + " %");
    }
    return;
  }
  delete incoming[m.id];
  const ext = (m.name.split(".").pop() || "").toLowerCase();
  const types = {jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", heic: "image/heic",
    pdf: "application/pdf", mp4: "video/mp4", mov: "video/quicktime", mp3: "audio/mpeg", txt: "text/plain", zip: "application/zip"};
  const type = types[ext] || "application/octet-stream";
  const blob = new Blob(f.parts, {type}), file = new File([blob], m.name, {type}), url = URL.createObjectURL(blob);
  const size = blob.size > 1e6 ? (blob.size / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(blob.size / 1e3)) + " KB";
  let close = null;
  const canShare = navigator.canShare && navigator.canShare({files: [file]});
  close = sheet(el("b", {}, "📥 From " + (m.from || link.host || "the PC")), el("div", {class: "sub", style: "margin:4px 0 12px"}, m.name + " · " + size),
    type.startsWith("image/") ? el("img", {src: url, style: "width:100%;max-height:45vh;object-fit:contain;border-radius:12px;background:#000"}) : null,
    el("div", {class: "btns", style: "margin-top:14px"},
      canShare ? el("button", {class: "btn", onclick: () => navigator.share({files: [file]}).catch(() => {})},
        type.startsWith("image/") || type.startsWith("video/") ? "Save to Photos / Share" : "Save to Files / Share") : null,
      el("a", {class: "btn2", href: url, download: m.name, style: "text-decoration:none;color:inherit"}, "Download"),
      el("button", {class: "btn2", onclick: () => close()}, "Close")));
  haptic();
}
function receiveText(text, from) {
  const t = text.trim(), isLink = /^https?:\/\/\S+$/i.test(t);
  let close = null;
  close = sheet(el("b", {}, (isLink ? "🔗 Link" : "📋 Text") + " from " + (from || link.host || "the PC")),
    el("div", {class: "card", dir: "auto", style: "margin-top:10px;max-height:40vh;overflow:auto;-webkit-user-select:text;user-select:text;word-break:break-word"}, t),
    el("div", {class: "btns"},
      isLink ? el("a", {class: "btn", href: t, target: "_blank", rel: "noopener", style: "text-decoration:none"}, "Open") : null,
      el("button", {class: isLink ? "btn2" : "btn", onclick: () => { if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast("Copied")); }}, "Copy"),
      el("button", {class: "btn2", onclick: () => close()}, "Close")));
  haptic();
}

// ---------------------------------------------------------------- pages
let cleanup = [];
function show(name, push = true, arg) {
  cleanup.forEach(f => f()); cleanup = [];
  app.innerHTML = "";
  (PAGES[name] || PAGES.home)(arg);
  window.scrollTo(0, 0);
  if (push && name !== "home") history.pushState({p: name, a: arg}, "");
}
window.addEventListener("popstate", ev => show(ev.state && ev.state.p || "home", false, ev.state && ev.state.a));
function every(ms, fn) { fn(); const id = setInterval(fn, ms); cleanup.push(() => clearInterval(id)); }
function page(title, right) {
  app.append(el("div", {class: "bar"},
    el("button", {class: "back", onclick: () => history.length > 1 ? history.back() : show("home", false)}, "‹ Home"),
    el("h1", {}, title), el("div", {class: "right"}, right || "")));
}
// the phone's own tools first (as in the Android app's "This tablet"), then the PC remote
const PHONE_TILES = [
  ["devices", "🔗", "Devices", "green"], ["reading", "📖", "Reading", "indigo"], ["notifs", "🔔", "Notifications", "red"],
  ["books", "📚", "Get Books", "orange"], ["poem", "🎲", "فال حافظ", "pink", {faal: 1}], ["notes", "🗒", "Notes", "yellow"],
  ["sketch", "✍️", "Handwriting", "blue"], ["scan", "📄", "Scanner", "blue"], ["focus", "⏱", "Focus", "red"],
  ["standby", "🕰", "StandBy", "orange"], ["claude", "✨", "Claude", "#d97757"],
];
const TILES = [
  ["keyboard", "⌨️", "Keyboard", "blue"], ["trackpad", "🖱", "Trackpad", "purple"], ["talk", "🎙", "Push to Talk", "red"],
  ["media", "🎵", "Media", "pink"],
  ["controls", "🎛", "Controls", "orange"], ["shortcuts", "⚡", "Shortcuts", "indigo"], ["apps", "🚀", "Apps", "teal"],
  ["text", "✍️", "Text & Clipboard", "yellow"], ["files", "📁", "Send Files", "blue"], ["windows", "🗂", "Windows", "indigo"],
  ["terminal", ">_", "Terminal Pad", "#3a3a3c"], ["presenter", "🎤", "Presenter", "red"],
  ["mirror", "🖥", "Show on PC", "blue"], ["clips", "📋", "Clipboard History", "teal"], ["sleep", "💤", "Sleep", "indigo"],
  ["webcam", "📷", "Webcam", "red"], ["stats", "📊", "Stats", "green"], ["settings", "⚙️", "Settings", "gray"],
];
const PAGES = {};

PAGES.home = () => {
  const open = (id, arg) => id === "claude" ? window.open("https://claude.ai/new", "_blank") : show(id, true, arg);
  const grid = list => el("div", {class: "tiles"}, list.map(([id, sym, label, color, arg]) =>
    el("button", {class: "tile", "data-q": label.toLowerCase() + " " + id, onclick: () => open(id, arg)}, chip(sym, color), el("b", {}, label))));
  const phone = grid(PHONE_TILES), pc = grid(TILES);
  const heads = [el("div", {class: "h"}, /iPad/.test(navigator.userAgent) ? "This iPad" : "This phone"), el("div", {class: "h"}, link.host || "The PC")];
  const q = el("input", {class: "search", type: "search", placeholder: "🔍 Search", style: "margin:0 0 4px"});
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase();
    [phone, pc].forEach((g, i) => { let n = 0;
      [...g.children].forEach(t => { const hit = !s || t.dataset.q.includes(s); t.style.display = hit ? "" : "none"; n += hit; });
      heads[i].style.display = n ? "" : "none"; });
  });
  // the book closed on the tablet in the last 3 days, to continue here
  const cont = el("div");
  const paint = () => {
    cont.innerHTML = "";
    const lr = ((link.shared || {}).lastread || {}).value;
    if (!lr || !lr.title || Date.now() - (lr.time || 0) > 3 * 86400e3) return;
    const gid = (/gutenberg-(\d+)\.epub/.exec(lr.uri || "") || [])[1];
    cont.append(el("div", {class: "card", style: "display:flex;gap:12px;align-items:center;margin:4px 0 6px"},
      chip("📖", lr.type === "pdf" ? "red" : "indigo"),
      el("div", {style: "flex:1;min-width:0"}, el("div", {class: "sub", style: "font-size:12px"}, "CONTINUE READING · FROM " + (((link.shared.lastread || {}).from) || "THE TABLET").toUpperCase()),
        el("b", {style: "display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"}, lr.title),
        el("small", {class: "sub"}, lr.total ? (lr.type === "pdf" ? "Page " : "Part ") + (lr.pos + 1) + " of " + lr.total : "")),
      gid ? el("button", {class: "btn", style: "padding:9px 14px", onclick: () => show("books", true, {book: {id: +gid, title: lr.title,
        epub: "https://www.gutenberg.org/ebooks/" + gid + ".epub3.images"}})}, "Read") :
        el("button", {class: "btn2", style: "padding:9px 14px", onclick: () => pickDevice("Which tablet?", d => { relay(d.id, {t: "remote", a: "sendbook", uri: lr.uri});
          toast("Asked " + d.name + " to send it"); }, d => d.kind === "android")}, "📥 Get")));
  };
  on("shared", paint); cleanup.push(() => on("shared", null)); paint();
  app.append(el("div", {class: "big"}, "Fedora Pad"), statusLine(), cont, q, heads[0], phone, heads[1], pc);
};

// ---- pairing
function showPairing() {
  cleanup.forEach(f => f()); cleanup = [];
  app.innerHTML = "";
  const code = el("input", {class: "code", inputmode: "numeric", maxlength: 6, autocomplete: "one-time-code", placeholder: "••••••"});
  const msg = el("p", {class: "sub center"}, "");
  const ask = async () => {
    const r = await fetch("/pair/request", {method: "POST"}).catch(() => null);
    msg.textContent = r && r.ok ? "A 6-digit code is now on the PC's screen. Type it here."
      : "Wait a few seconds, then try again.";
    code.focus();
  };
  const confirm = async () => {
    const name = /iPad/.test(navigator.userAgent) ? "iPad" : /iPhone/.test(navigator.userAgent) ? "iPhone"
      : /Android/.test(navigator.userAgent) ? "Android" : "Browser";
    const r = await fetch("/pair/confirm", {method: "POST", body: JSON.stringify({code: code.value, name})}).catch(() => null);
    const data = r ? await r.json().catch(() => ({})) : {};
    if (data.token) { store.set("token", data.token); toast("Paired ✓"); show("home", false); connect(); }
    else { msg.textContent = "That code didn't work. Ask for a new one."; code.value = ""; }
  };
  code.addEventListener("input", () => { if (code.value.length === 6) confirm(); });
  app.append(el("div", {class: "big"}, "Fedora Pad"),
    el("div", {class: "card"},
      el("p", {}, "Pair this " + (/iPhone/.test(navigator.userAgent) ? "iPhone" : "device") + " with your PC once."),

const LETTERS = [
  ["esc|esc", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "⌫|backspace"],
  ["tab|tab", "q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "[", "]", "\\"],
  ["a", "s", "d", "f", "g", "h", "j", "k", "l", ";", "'", "return|enter"],
  ["⇧|shift", "z", "x", "c", "v", "b", "n", "m", ",", ".", "/", "↑|up"],
  ["123|numpad", "ctrl|ctrl", "alt|alt", "⌘|super", " |space", "←|left", "↓|down", "→|right", "فا|lang"],
];
const NUMPAD = [
  ["7|kp7", "8|kp8", "9|kp9", "÷|kpslash", "⌫|backspace"], ["4|kp4", "5|kp5", "6|kp6", "×|kpasterisk", "tab|tab"],
  ["1|kp1", "2|kp2", "3|kp3", "−|kpminus", "esc|esc"], ["ABC|letters", "0|kp0", ".|kpdot", "+|kpplus", "return|kpenter"],
];
const FA_KEYS = "1234567890-=qwertyuiop[]\\asdfghjkl;'zxcvbnm,./";
const FA_NORMAL = ["۱","۲","۳","۴","۵","۶","۷","۸","۹","۰","-","=","ض","ص","ث","ق","ف","غ","ع","ه","خ","ح","ج","چ","\\",
  "ش","س","ی","ب","ل","ا","ت","ن","م","ک","گ","ظ","ط","ز","ر","ذ","د","پ","و",".","/"];
const FA_SHIFT = ["!","٬","٫","﷼","٪","×","،","*",")","(","ـ","+","◌ْ","◌ٌ","◌ٍ","◌ً","◌ُ","◌ِ","◌َ","◌ّ","]","[","}","{","|",
  "ؤ","ئ","ي","إ","أ","آ","ة","»","«",":","؛","ك","◌ٓ","ژ","◌ٰ","‌نیم","◌ٔ","ء",">","<","؟"];
const KEY_NAME = {"-": "minus", "=": "equal", "[": "leftbrace", "]": "rightbrace", "\\": "backslash", ";": "semicolon",
  "'": "apostrophe", ",": "comma", ".": "dot", "/": "slash"};
const SHIFTED = {"1":"!","2":"@","3":"#","4":"$","5":"%","6":"^","7":"&","8":"*","9":"(","0":")","-":"_","=":"+",
  "[":"{","]":"}","\\":"|",";":":","'":"\"",",":"<",".":">","/":"?"};
const REPEAT = new Set(["backspace", "left", "right", "up", "down", "space"]);

function keyboardView() {
  const st = {numpad: false, shift: false, caps: false, lastShift: 0, mods: new Set(), fa: store.get("fa", false)};
  const box = el("div", {class: "kb"});
  const draw = () => {
    box.innerHTML = "";
    for (const row of st.numpad ? NUMPAD : LETTERS) {
      const r = el("div", {class: "kr"});
      for (const spec of row) {
        const [label, key = ""] = spec.split("|");
        let shown = label;
        const fi = st.fa && !key ? FA_KEYS.indexOf(label) : -1;
        if (fi >= 0) shown = (st.shift ? FA_SHIFT : FA_NORMAL)[fi];
        else if (!key && st.shift) shown = SHIFTED[label] || label.toUpperCase();
        if (key === "lang") shown = st.fa ? "EN" : "فا";
        if (key === "space") shown = st.fa ? "فارسی" : " ";
        const special = !!key && label.length > 1 || ["shift", "super", "lang", "numpad", "letters"].includes(key);
        const on = (key === "shift" && st.shift) || st.mods.has(key);
        const b = el("button", {class: "k" + (special ? " m" : "") + (on ? " on" : ""),
          style: key === "space" ? "flex:5" : ["enter", "shift", "backspace", "tab"].includes(key) && !st.numpad ? "flex:1.6" : ""},
          key === "shift" && st.caps ? "⇪" : shown);
        let timer = null;
        b.addEventListener("pointerdown", ev => {
          ev.preventDefault(); haptic(); press(label, key);
          if (REPEAT.has(key)) timer = setTimeout(function again() { press(label, key); timer = setTimeout(again, 65); }, 380);
        });
        const stop = () => clearTimeout(timer);
        b.addEventListener("pointerup", stop); b.addEventListener("pointerleave", stop); b.addEventListener("pointercancel", stop);
        r.append(b);
      }
      box.append(r);
    }
  };
  const press = (label, key) => {
    if (key === "numpad") { st.numpad = true; return draw(); }
    if (key === "letters") { st.numpad = false; return draw(); }
    if (key === "lang") { st.fa = !st.fa; store.set("fa", st.fa); send({t: "lang", id: st.fa ? "fa" : "en"}); return draw(); }
    if (key === "shift") {
      const now = Date.now();
      if (now - st.lastShift < 350) { st.caps = !st.caps; st.shift = st.caps; } else { st.shift = !st.shift; st.caps = false; }
      st.lastShift = now; return draw();
    }
    if (["ctrl", "alt", "super"].includes(key)) { st.mods.has(key) ? st.mods.delete(key) : st.mods.add(key); return draw(); }
    const mods = [...st.mods].map(m => m + "+").join("");
    if (st.fa && !key && FA_KEYS.includes(label)) {
      combo(mods + (st.shift ? "shift+" : "") + (KEY_NAME[label] || label));  // Persian: the PC's Persian layout makes the letter
    } else if (!key && !mods) {
      send({t: "text", s: st.shift ? (SHIFTED[label] || label.toUpperCase()) : label});
    } else {
      combo(mods + (st.shift && !key.startsWith("kp") ? "shift+" : "") + (key || KEY_NAME[label] || label));
    }
    const redraw = st.mods.size || (st.shift && !st.caps);
    st.mods.clear(); if (!st.caps) st.shift = false;
    if (redraw) draw();
  };
  if (st.fa) send({t: "lang", id: "fa"});
  draw();
  return box;
}

/**
 * The phone's own keyboard (any language, dictation, emoji, suggestions) typing live on the PC.
 * The box always holds a few invisible spaces; after every change it is compared with them:
 * fewer = that many Backspaces, new characters = that text. Then it goes back to the spaces.
 * This works on iPhone, where an empty box sends no Backspace and Safari won't let a page
 * block autocorrect; and autocorrect can't rewrite earlier words, because the box never has them.
 */
function phoneKeyboard() {
  const PAD = "\u00a0\u00a0\u00a0\u00a0";
  const input = el("input", {class: "phonekb", placeholder: "Tap here and type: it appears on the PC", "aria-label": "Type on the PC",
    autocomplete: "off", autocorrect: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "send"});
  input.value = PAD;
  let composing = false;
  const reset = () => { input.value = PAD; try { input.setSelectionRange(PAD.length, PAD.length); } catch (e) {} };
  const flush = () => {
    const v = input.value;
    if (v === PAD) return;
    let p = 0;  // unchanged start
    while (p < v.length && p < PAD.length && v[p] === PAD[p]) p++;
    let q = 0;  // unchanged end
    while (q < v.length - p && q < PAD.length - p && v[v.length - 1 - q] === PAD[PAD.length - 1 - q]) q++;
    const removed = PAD.length - p - q, typed = v.slice(p, v.length - q).replace(/\u00a0/g, " ");
    for (let i = 0; i < removed; i++) combo("backspace");
    typed.split("\n").forEach((line, i) => { if (i) combo("enter"); if (line) send({t: "text", s: line}); });
    reset();
  };
  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend", () => { composing = false; flush(); });
  input.addEventListener("input", () => { if (!composing) flush(); });
  input.addEventListener("keydown", ev => {  // keys that make no text
    const map = {Enter: "enter", ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Tab: "tab", Escape: "esc"};
    if (map[ev.key]) { ev.preventDefault(); combo(map[ev.key]); }
  });
  // keep the cursor after the spaces, so a Backspace always has something to remove
  ["focus", "click", "pointerup"].forEach(e => input.addEventListener(e, () => setTimeout(() => { if (input.value === PAD) reset(); }, 0)));
  return input;
}

// ---- trackpad
function trackpad(height) {
  const pad = el("div", {class: "pad", style: height ? "height:" + height : ""},
    "One finger: move · tap: click\nTwo fingers: scroll · two-finger tap: right click\nDouble-tap and hold: drag");
  const pts = new Map();
  let start = 0, moved = false, maxPts = 0, lastTap = 0, dragging = false, lastMid = null;
  const speed = () => store.get("speed", 1);
  pad.addEventListener("pointerdown", ev => {
    pad.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId, {x: ev.clientX, y: ev.clientY, t: ev.timeStamp});
    if (pts.size === 1) {
      start = ev.timeStamp; moved = false; maxPts = 1;
      if (ev.timeStamp - lastTap < 280) { dragging = true; send({t: "btn", b: "left", s: "down"}); }
    }
    maxPts = Math.max(maxPts, pts.size); lastMid = null;
  });
  pad.addEventListener("pointermove", ev => {
    const p = pts.get(ev.pointerId); if (!p) return;
    const dx = ev.clientX - p.x, dy = ev.clientY - p.y, dt = Math.max(1, ev.timeStamp - p.t);
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (pts.size === 1) {
      const v = Math.hypot(dx, dy) / dt;  // px per ms: faster = farther, slow = precise
      const gain = speed() * devicePixelRatio * (1.2 + Math.min(v * 2.5, 2.5));
      send({t: "move", dx: dx * gain, dy: dy * gain});
    } else if (pts.size === 2) {  // two fingers: scroll by how far their midpoint moves
      p.x = ev.clientX; p.y = ev.clientY; p.t = ev.timeStamp;
      const [a, b] = [...pts.values()], mid = [(a.x + b.x) / 2, (a.y + b.y) / 2];
      if (lastMid) send({t: "scroll", dx: (mid[0] - lastMid[0]) * 1.4, dy: (mid[1] - lastMid[1]) * 1.4});
      lastMid = mid;
      return;
    }
    p.x = ev.clientX; p.y = ev.clientY; p.t = ev.timeStamp;
  });
  const up = ev => {
    if (!pts.delete(ev.pointerId)) return;
    if (pts.size) return;
    const quick = ev.timeStamp - start < 250 && !moved;
    if (dragging) { send({t: "btn", b: "left", s: "up"}); dragging = false; lastTap = 0; return; }
    if (quick && maxPts === 2) { send({t: "btn", b: "right", s: "click"}); haptic(); }
    else if (quick && maxPts === 1) { send({t: "btn", b: "left", s: "click"}); lastTap = ev.timeStamp; }
  };
  pad.addEventListener("pointerup", up); pad.addEventListener("pointercancel", up);
  const clicks = el("div", {class: "clicks"},
    el("button", {onpointerdown: e => { e.preventDefault(); haptic(); send({t: "btn", b: "left", s: "down"}); },
      onpointerup: () => send({t: "btn", b: "left", s: "up"})}, ""),
    el("button", {onclick: () => { haptic(); send({t: "btn", b: "right", s: "click"}); }}, ""));
  return [pad, clicks];
}

// ---- Push to Talk: hold the button, speak, let go: the words are typed on the PC
PAGES.talk = () => {
  page("Push to Talk");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let engine = store.get("pttEngine", SR ? "phone" : "pc"), lang = store.get("pttLang", "auto"), tap = store.get("pttTap", false);
  const status = el("div", {class: "center", style: "font-weight:700;font-size:18px;margin:6px 0 10px"}, "Hold to talk");
  const words = el("div", {class: "card center", dir: "auto", style: "min-height:96px;font-size:20px;-webkit-user-select:text;user-select:text"}, "");
  const mic = el("button", {style: "width:min(52vw,190px);height:min(52vw,190px);border-radius:50%;background:var(--red);color:#fff;"
    + "font-size:72px;display:block;margin:18px auto;touch-action:none;box-shadow:0 10px 30px #ff3b3055;transition:transform .12s"}, "🎙");
  let holding = false, rec = null, done = true, stream = null, audio = null;
  const terminal = () => /terminal|ptyxis|console|konsole|kitty|alacritty|wezterm|tilix/i.test(link.app);
  const typeOnPc = text => { send({t: "setclip", s: text + " "}); setTimeout(() => combo(terminal() ? "ctrl+shift+v" : "ctrl+v"), 250); };
  const look = on => { mic.style.transform = on ? "scale(1.12)" : ""; mic.style.background = on ? "#ff6961" : "var(--red)"; };

  // 📱 the phone's own speech recognition: words appear while you speak
  const phoneDown = () => {
    if (!SR) { status.textContent = "⚠️ No speech recognition here: choose “PC (offline)”"; return false; }
    rec = new SR();
    rec.lang = lang === "auto" ? (navigator.language || "en-US") : lang;
    rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; words.textContent = t.trim(); };
    rec.onerror = e => { status.textContent = e.error === "not-allowed" || e.error === "service-not-allowed"
      ? "⚠️ Allow the microphone and Speech Recognition for Safari in Settings" : e.error === "no-speech" ? "Didn't hear anything" : "⚠️ " + e.error; };
    rec.onend = () => {
      if (holding) { try { rec.start(); } catch (e) {} return; }  // keep listening through pauses while held
      if (done) return;
      done = true;
      const text = words.textContent.trim();
      if (text) { typeOnPc(text); status.textContent = "✅ Typed on the PC"; } else status.textContent = "Didn't hear any words";
    };
    words.textContent = ""; done = false;
    try { rec.start(); } catch (e) { status.textContent = "⚠️ " + e.message; return false; }
    status.textContent = "🎙 Listening…";
    return true;
  };
  const phoneUp = () => { status.textContent = "✍️ Finishing…"; if (rec) rec.stop(); };

  // 💻 the phone's mic, written down on the PC by Whisper (offline, good Persian)
  const pcDown = async () => {
    try {
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
    } catch (e) { status.textContent = "⚠️ Allow the microphone for this page"; return false; }
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audio = new AC();
      const src = audio.createMediaStreamSource(stream), proc = audio.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = e => {
        if (!holding) return;
        const f = e.inputBuffer.getChannelData(0), pcm = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-1, Math.min(1, f[i])) * 0x7fff;
        send({t: "pttpcm", pcm: b64(pcm.buffer)});
      };
      src.connect(proc); proc.connect(audio.destination);
    }
    await audio.resume();
    send({t: "pttstart", rate: Math.round(audio.sampleRate)});
    words.textContent = ""; status.textContent = "🎙 Listening (the PC writes it down)…";
    return true;
  };
  const pcUp = () => { send({t: "pttstop"}); status.textContent = "✍️ Sending…"; };
  on("ptt", m => {
    if (m.state === "writing") status.textContent = "✍️ The PC is writing it down…";
    else if (m.state === "done") { words.textContent = m.text || ""; status.textContent = m.text ? "✅ Typed on the PC" : "Didn't hear any words"; }
    else if (m.state === "error") status.textContent = "⚠️ " + m.error;
  });

  const down = async () => {
    if (holding) return;
    if (!link.connected) { status.textContent = "Not connected to the PC"; return; }
    holding = true; haptic(); look(true);
    const ok = engine === "phone" ? phoneDown() : await pcDown();
    if (!ok) { holding = false; look(false); }
  };
  const up = () => {
    if (!holding) return;
    holding = false; haptic(); look(false);
    engine === "phone" ? phoneUp() : pcUp();
  };
  mic.addEventListener("pointerdown", e => { e.preventDefault(); if (tap && holding) up(); else down(); });
  mic.addEventListener("pointerup", () => { if (!tap) up(); });
  mic.addEventListener("pointercancel", () => { if (!tap) up(); });
  mic.addEventListener("contextmenu", e => e.preventDefault());
  cleanup.push(() => { holding = false; if (rec) rec.abort(); if (stream) stream.getTracks().forEach(t => t.stop());
    if (audio) audio.close().catch(() => {}); on("ptt", null); });

  const tapToggle = el("div", {class: "toggle" + (tap ? " on" : "")});
  app.append(el("p", {class: "sub center"}, "Click where you want to write on the PC, then hold the button and speak."),
    mic, status, words,
    el("div", {class: "h"}, "Speech"),
    seg([["phone", "📱 iPhone speech"], ["pc", "💻 PC (offline)"]], engine, v => { engine = v; store.set("pttEngine", v); }),
    el("p", {class: "sub"}, "iPhone speech shows the words as you speak (needs the internet). PC uses Whisper on Fedora: "
      + "offline and better for Persian (run ./host/voice-setup.sh once)."),
    el("div", {class: "h"}, "Language (iPhone speech)"),
    seg([["auto", "Automatic"], ["en-US", "English"], ["fa-IR", "فارسی"]], lang, v => { lang = v; store.set("pttLang", v); }),
    el("div", {class: "group", style: "margin-top:14px"}, el("button", {class: "row", onclick: () => {
      tap = !tap; store.set("pttTap", tap); tapToggle.classList.toggle("on", tap); }},
      chip("👆", "blue"), el("div", {class: "grow"}, "Tap to start, tap to stop", el("small", {}, "Instead of holding the button")), tapToggle)));
};

// ---- webcam: this phone's camera and mic as the PC's webcam (Fedora)
function b64(buf) {
  const bytes = new Uint8Array(buf); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
PAGES.webcam = () => {
  page("Webcam");
  const video = el("video", {playsinline: true, autoplay: true,
    style: "width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:16px"});
  video.muted = true;
  const state = el("div", {class: "center", style: "font-weight:700;margin:10px 0"}, "Off");
  const go = el("button", {class: "btn", style: "width:100%;margin-top:14px"}, "Start");
  let facing = store.get("facing", "user"), useMic = store.get("camMic", true), live = false;
  let stream = null, timer = null, audio = null, wake = null;
  const canvas = document.createElement("canvas"); canvas.width = 1280; canvas.height = 720;
  const g = canvas.getContext("2d");
  const micToggle = el("div", {class: "toggle" + (useMic ? " on" : "")});
  const stop = (tell = true) => {
    if (tell && live) send({t: "webcam", on: false});
    live = false; clearInterval(timer); timer = null;
    if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null;
    if (audio) { audio.close().catch(() => {}); audio = null; }
    if (wake) { wake.release().catch(() => {}); wake = null; }
    go.textContent = "Start"; go.style.background = ""; state.textContent = "Off";
  };
  const start = async () => {
    if (link.os === "windows") { state.textContent = "⚠️ Webcam mode works with Fedora for now."; return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}},
        audio: useMic ? {echoCancellation: true, noiseSuppression: true} : false});
    } catch (e) { state.textContent = "⚠️ Allow the camera for this page (" + e.name + ")"; return; }
    video.srcObject = stream; video.play().catch(() => {});
    live = true; go.textContent = "Stop"; go.style.background = "var(--red)"; state.textContent = "Starting…";
    send({t: "webcam", on: true, src: "web", mic: useMic});
    timer = setInterval(() => {  // ~15 pictures a second, skipped when the Wi-Fi falls behind
      if (!video.videoWidth || !link.ws || link.ws.bufferedAmount > 600000) return;
      const k = Math.min(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
      const w = video.videoWidth * k, h = video.videoHeight * k;
      g.fillStyle = "#000"; g.fillRect(0, 0, canvas.width, canvas.height);
      g.drawImage(video, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
      canvas.toBlob(b => b && b.arrayBuffer().then(buf => send({t: "camframe", jpg: b64(buf)})), "image/jpeg", 0.65);
    }, 66);
    if (useMic) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audio = new AC();
      const src = audio.createMediaStreamSource(stream), proc = audio.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = e => {
        const f = e.inputBuffer.getChannelData(0), pcm = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-1, Math.min(1, f[i])) * 0x7fff;
        send({t: "micpcm", pcm: b64(pcm.buffer), rate: audio.sampleRate});
      };
      src.connect(proc); proc.connect(audio.destination);
    }
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  };
  go.addEventListener("click", () => live ? stop() : start());
  on("webcam", m => {
    if (m.error) { state.textContent = "⚠️ " + m.error; stop(false); }
    else if (m.on) state.textContent = "🔴 On: the PC sees this camera";
  });
  cleanup.push(() => { stop(); on("webcam", null); });
  app.append(video, state,
    seg([["user", "🤳 Front"], ["environment", "📷 Back"]], facing, v => { facing = v; store.set("facing", v); if (live) { stop(); start(); } }),
    el("div", {class: "group", style: "margin-top:12px"}, el("button", {class: "row", onclick: () => {
      useMic = !useMic; store.set("camMic", useMic); micToggle.classList.toggle("on", useMic); }},
      chip("🎤", "red"), el("div", {class: "grow"}, "Use this phone's microphone too"), micToggle)),
    go,
    el("p", {class: "sub"}, "In Zoom, Meet or OBS on the PC, choose “Fedora Pad Camera” and “Fedora Pad Microphone”. "
      + "Keep this page open in front while it's on. First time: run ./host/webcam-setup.sh on Fedora."));
};

    return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " days ago"; };

// web pages the PC fetches for us (Get Books, Persian poetry)
async function net(url, asBlob) {
  const r = await fetch("/net?token=" + encodeURIComponent(store.get("token", "")) + "&u=" + encodeURIComponent(url));
  if (!r.ok) { let why = r.status; try { why = (await r.json()).error || why; } catch (e) {} throw new Error(why); }
  return asBlob ? r.blob() : r.json();
}
// a file to the PC's Downloads › Fedora Pad, like Send Files
async function sendBlob(name, blob, progress) {
  if (!link.connected) { toast("Not connected to the PC"); return false; }
  const id = Math.random().toString(36).slice(2), CHUNK = 48 * 1024;
  for (let at = 0; at < blob.size || at === 0; at += CHUNK) {
    const buf = new Uint8Array(await blob.slice(at, at + CHUNK).arrayBuffer());
    let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    while (link.ws && link.ws.bufferedAmount > 512 * 1024) await new Promise(r => setTimeout(r, 30));
    send({t: "file", id, name, data: btoa(bin), last: at + CHUNK >= blob.size});
    if (progress) progress(Math.min(100, Math.round((at + CHUNK) * 100 / Math.max(blob.size, 1))));
    if (blob.size === 0) break;
  }
  return true;
}
// share sheet when the phone has one (Save to Files / Photos / Books), else a download
async function shareBlob(name, blob) {
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]})) return navigator.share({files: [file]}).catch(() => {});
  const a = el("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove();
}

function addNote(text) {

  send({t: "notes?"});
}
// Claude: the question is copied, and claude.ai (or the Claude app) opens with it
function askClaude(question) {
  if (navigator.clipboard) navigator.clipboard.writeText(question).catch(() => {});
  window.open("https://claude.ai/new?q=" + encodeURIComponent(question), "_blank");
}
function speak(text, lang) {
  if (!window.speechSynthesis) return toast("This browser can't read aloud");
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith("fa") ? 0.85 : 1;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").toLowerCase().startsWith(lang.slice(0, 2)));
  if (v) u.voice = v; else if (lang.startsWith("fa")) toast("No Persian voice on this device: it reads with another voice");
  speechSynthesis.speak(u);
  cleanup.push(() => speechSynthesis.cancel());
}

PAGES.focus = () => {
  page("Focus");
  const st = store.get("focus", {work: 25, rest: 5});
  let left = st.work * 60, phase = "work", timer = null, endAt = 0, rounds = 0;
  const ring = el("div", {style: "width:230px;height:230px;border-radius:50%;margin:10px auto 18px;display:grid;place-items:center"});
  const clock = el("div", {style: "font-size:54px;font-weight:300;font-variant-numeric:tabular-nums;background:var(--bg);width:200px;height:200px;border-radius:50%;display:grid;place-items:center"});
  ring.append(clock);
  const label = el("div", {class: "center sub", style: "margin-top:-6px;margin-bottom:14px"});
  const start = el("button", {class: "btn"}, "Start");
  const total = () => (phase === "work" ? st.work : st.rest) * 60;
  const paint = () => {
    const pct = 100 - left * 100 / total(), color = phase === "work" ? "var(--red)" : "var(--green)";
    ring.style.background = `conic-gradient(${color} ${pct}%, var(--fill) 0)`;
    clock.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    label.textContent = (phase === "work" ? "🎯 Focus" : "☕ Break") + (rounds ? "  ·  " + rounds + " done today" : "");
    start.textContent = timer ? "Pause" : left < total() ? "Resume" : "Start";
  };
  const tick = () => {
    left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (left === 0) {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      if (phase === "work") rounds++;
      phase = phase === "work" ? "rest" : "work"; left = total(); endAt = Date.now() + left * 1000;
      toast(phase === "work" ? "Break over: focus!" : "Well done: take a break ☕");
    }
    paint();
  };
  const stop = () => { clearInterval(timer); timer = null; paint(); };
  start.addEventListener("click", () => { if (timer) return stop();
    endAt = Date.now() + left * 1000; timer = setInterval(tick, 500); paint();
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => cleanup.push(() => l.release())).catch(() => {}); });
  const choose = (key, values) => el("div", {class: "seg"}, values.map(v => el("button", {class: st[key] === v ? "on" : "", onclick: e => {
    st[key] = v; store.set("focus", st); [...e.currentTarget.parentNode.children].forEach(b => b.classList.toggle("on", b === e.currentTarget));
    if (!timer) { left = total(); paint(); } }}, v + " min")));
  app.append(ring, label, el("div", {class: "btns"}, start, el("button", {class: "btn2", onclick: () => { stop(); phase = "work"; left = total(); paint(); }}, "Reset")),
    el("div", {class: "h"}, "Focus"), choose("work", [15, 25, 45, 60]), el("div", {class: "h"}, "Break"), choose("rest", [5, 10, 15]),
    el("p", {class: "sub"}, "The screen stays on while the timer runs. When a round ends, this device vibrates (on phones that can)."));
  cleanup.push(() => clearInterval(timer));
  paint();
};

  const canvas = el("canvas", {style: "width:100%;height:calc(100vh - 250px);min-height:280px;background:#fff;border-radius:16px;touch-action:none;display:block"});
  let color = "#1d1d1f", width = 3, strokes = [];

    [["#1d1d1f", "⚫"], ["#007aff", "🔵"], ["#ff3b30", "🔴"], ["#34c759", "🟢"], ["#ffffff", "🧽"]].map(([c, s]) =>
      el("button", {class: "btn2", onclick: () => { color = c; width = c === "#ffffff" ? 24 : 3; }}, s)),
    el("button", {class: "btn2", onclick: () => { strokes.pop(); redraw(); }}, "↩️"),
    el("button", {class: "btn2", onclick: () => { strokes = []; redraw(); }}, "🗑"));
  const ctx = canvas.getContext("2d");
  const size = () => { const r = canvas.getBoundingClientRect(), s = devicePixelRatio || 1;
    canvas.width = r.width * s; canvas.height = r.height * s; ctx.setTransform(s, 0, 0, s, 0, 0); redraw(); };
  const line = st => { ctx.strokeStyle = st.c; ctx.lineWidth = st.w; ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath();
    st.p.forEach(([x, y, f], i) => { ctx.lineWidth = st.w * (0.6 + f * 0.8); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); };
  const redraw = () => { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); strokes.forEach(line); };
  let cur = null;

  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); cur = {c: color, w: width, p: [pt(e)]}; strokes.push(cur); });
  canvas.addEventListener("pointermove", e => { if (!cur) return; cur.p.push(pt(e)); line(cur); });

  };
  function bookSheet(b, gid) {
    const close = sheet(el("b", {}, b.title), el("div", {class: "sub", style: "margin:4px 0 14px"}, b.total ? "On the tablet: " + ((b.type === "pdf" ? "page " : "part ") + (b.pos + 1)) + " of " + b.total : ""),
      el("div", {class: "btns"},
        gid ? el("button", {class: "btn", onclick: () => { close(); show("books", true, {book: {id: +gid, title: b.title,
          epub: "https://www.gutenberg.org/ebooks/" + gid + ".epub3.images"}}); }}, "📲 Read here") : null,
        el("button", {class: gid ? "btn2" : "btn", onclick: () => { pickDevice("Which tablet?", d => { relay(d.id, {t: "remote", a: "sendbook", uri: b.uri});
          toast("Asked " + d.name + " to send it"); }, d => d.kind === "android"); close(); }}, "📥 Get it from the tablet"),
        el("button", {class: "btn2", onclick: () => close()}, "Close")));
  }
  on("shared", draw);
  cleanup.push(() => on("shared", null));
  draw(); send({t: "shared?"});
};

// ---------------------------------------------------------------- start
history.replaceState({p: "home"}, "");
if (store.get("token", "")) { show("home", false); connect(); } else showPairing();
</script>
</body>
