name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Make an official release with this tag (e.g. v1.0); leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # one build at a time: two branches publishing the same release at once collide
    concurrency:
      group: apk-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TabletDesk.apk
          echo "$GITHUB_RUN_NUMBER" > ../version.txt
      # A copy of Google's adb for Windows next to the app, for PCs that can't
      # reach Google's servers (windows/setup.ps1 downloads it from here)
      - name: Mirror Android platform-tools and scrcpy for Windows
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          curl -fsSL -o ../platform-tools-windows.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -tq ../platform-tools-windows.zip
          (cd .. && sha256sum platform-tools-windows.zip | cut -d' ' -f1 > platform-tools-windows.sha256)
          # and the official scrcpy for Windows (Tablet Mirroring), same reason
          tag=$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/Genymobile/scrcpy/releases/latest | sed 's#.*/##')
          curl -fsSL -o ../scrcpy-win64.zip "https://github.com/Genymobile/scrcpy/releases/download/$tag/scrcpy-win64-$tag.zip"
          unzip -tq ../scrcpy-win64.zip
          (cd .. && sha256sum scrcpy-win64.zip | cut -d' ' -f1 > scrcpy-win64.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: TabletDesk-apk
          path: TabletDesk.apk
      # Fixed download link for the newest app, used by host/connect.sh to
      # update the tablet automatically:
      # releases/download/latest-apk/TabletDesk.apk (+ version.txt)
      - name: Publish newest APK
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: TabletDesk (newest build)
          body: "Newest TabletDesk app, build ${{ github.run_number }} from ${{ github.ref_name }}. Plugging the tablet in installs it automatically."
          prerelease: true
          make_latest: false
          files: |
            TabletDesk.apk
            version.txt
            platform-tools-windows.zip
            platform-tools-windows.sha256
            scrcpy-win64.zip
            scrcpy-win64.sha256
      - name: Official release (tags v*, or run manually with a tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TabletDesk ${{ inputs.release || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          body: |
            Your Android tablet as a second screen, keyboard, trackpad and Touch Bar for Fedora, over one USB-C cable.

            **Install:** download `TabletDesk.apk` below onto the tablet, then on Fedora:
            ```bash
            git clone https://github.com/aliihjt/Android-as-ubuntu-keyboard.git
            cd Android-as-ubuntu-keyboard && ./host/setup.sh
            ```
            Full guide: see the README.
          files: TabletDesk.apk

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check host scripts
        run: |
          bash -n host/connect.sh host/setup.sh
          python3 -m py_compile host/tabletdesk_host.py
