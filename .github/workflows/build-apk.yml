name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TabletDesk.apk
          echo "$GITHUB_RUN_NUMBER" > ../version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TabletDesk-apk
          path: TabletDesk.apk
      # Fixed download link for the newest app, used by host/connect.sh to
      # update the tablet automatically:
      # releases/download/latest-apk/TabletDesk.apk (+ version.txt)
      - name: Publish newest APK
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: TabletDesk (newest build)
          body: "Newest TabletDesk app, build ${{ github.run_number }} from ${{ github.ref_name }}. Plugging the tablet in installs it automatically."
          prerelease: true
          make_latest: false
          files: |
            TabletDesk.apk
            version.txt
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TabletDesk.apk

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check host scripts
        run: |
          bash -n host/connect.sh host/setup.sh
          python3 -m py_compile host/tabletdesk_host.py
