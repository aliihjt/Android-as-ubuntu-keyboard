plugins {
    id 'com.android.application'
}

// CI build number, so every new APK is a higher version than the last one
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'io.github.aliihjt.tabletdesk'
    compileSdk 34

    // One fixed signing key: without it every CI build gets a random key and
    // Android refuses to update the installed app. A private key is used when the
    // repo has the FEDORAPAD_KEYSTORE secret (see README › Private signing key);
    // otherwise the public debug.keystore in this repo.
    def privateStore = System.getenv('FEDORAPAD_KEYSTORE_FILE')
    signingConfigs {
        debug {
            if (privateStore) {
                storeFile file(privateStore)
                storePassword System.getenv('FEDORAPAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FEDORAPAD_KEY_ALIAS')
                keyPassword System.getenv('FEDORAPAD_KEY_PASSWORD') ?: System.getenv('FEDORAPAD_KEYSTORE_PASSWORD')
            } else {
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'io.github.aliihjt.tabletdesk'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.$buildNumber"
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
